image: maven:3.9-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_ARGS: "-B -ntp"
  BASE_URL: "https://dummyjson.com"

cache:
  paths:
    - .m2/repository

stages:
  - test
  - report

smoke:
  stage: test
  script:
    - ./mvnw clean test -Dgroups=smoke
  artifacts:
    when: always
    paths:
      - target/allure-results

regression:
  stage: test
  needs: ["smoke"]
  script:
    - ./mvnw clean test
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/surefire-reports

# Divergências conhecidas da documentação: falham enquanto existirem, sem quebrar o pipeline.
known-defects:
  stage: test
  needs: ["regression"]
  allow_failure: true
  script:
    - ./mvnw clean test -Dgroups=defeito -DexcludedGroups=none
  artifacts:
    when: always
    paths:
      - target/allure-results

allure-report:
  stage: report
  when: always
  needs:
    - job: regression
      artifacts: true
  script:
    - ./mvnw allure:report
  artifacts:
    when: always
    paths:
      - target/site/allure-maven-plugin
